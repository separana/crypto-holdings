<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <title>Holdings Pro</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #182234;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --acc: #3b82f6;
      --acc-glow: rgba(59, 130, 246, 0.25);
      --good: #10b981;
      --good-bg: rgba(16, 185, 129, 0.12);
      --bad: #f43f5e;
      --bad-bg: rgba(244, 63, 94, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font: 15px/1.45 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(900px 450px at 50% -120px, #1e293b 0%, var(--bg) 70%) no-repeat, var(--bg);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(9, 13, 22, 0.8);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 12px 16px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 12px var(--good); }
    .actions { display: flex; gap: 6px; align-items: center; }

    /* Layout Grid */
    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 16px; }
    @media(min-width: 960px) { .grid { grid-template-columns: 1.85fr 1fr; align-items: start; } }

    .card {
      background: linear-gradient(180deg, rgba(24, 34, 52, 0.75) 0%, rgba(17, 24, 39, 0.95) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Hero Portfolio Card */
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .hero-label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .hero-val { font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.8px; margin: 2px 0 6px; }
    .hero-sub { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px;
    }
    .pill.gain { background: var(--good-bg); color: var(--good); }
    .pill.loss { background: var(--bad-bg); color: var(--bad); }
    .pill.neutral { background: rgba(255,255,255,0.06); color: var(--muted); }

    .chart-box {
      position: relative; height: 210px; margin: 16px 0 8px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Form & Autocomplete */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .field { position: relative; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    input, select, button {
      width: 100%; padding: 10px 12px; border-radius: 11px;
      border: 1px solid var(--border); background: #0c1220; color: var(--text);
      font-size: 14px; font-family: inherit; transition: all .15s ease;
    }
    input:focus, select:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-glow); }
    input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--acc); cursor: pointer; }

    .dropdown {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 40;
      margin-top: 4px; background: #131c2e; border: 1px solid var(--border-hover);
      border-radius: 12px; max-height: 240px; overflow-y: auto;
      box-shadow: 0 14px 32px rgba(0,0,0,0.6); display: none;
    }
    .dropdown.open { display: block; }
    .drop-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .drop-item:hover { background: rgba(59, 130, 246, 0.15); }
    .drop-item img { width: 22px; height: 22px; border-radius: 50%; }

    /* Buttons */
    button { cursor: pointer; font-weight: 600; }
    button:hover { border-color: var(--border-hover); filter: brightness(1.08); }
    button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
    button.dca { background: var(--good-bg); border-color: rgba(16, 185, 129, 0.35); color: var(--good); }
    button.danger { background: var(--bad-bg); border-color: rgba(244, 63, 94, 0.35); color: var(--bad); }
    button.ghost { background: rgba(255,255,255,0.03); color: var(--muted); }
    button.icon-btn { width: auto; padding: 7px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

    /* Asset Cards */
    .assets-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
    .assets { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 680px) { .assets { grid-template-columns: 1fr 1fr; } }

    .asset {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; transition: transform .15s, border-color .15s;
    }
    .asset:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .asset-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .asset-id { display: flex; align-items: center; gap: 10px; }
    .coin-icon {
      width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; flex-shrink: 0;
    }
    .coin-icon img { width: 100%; height: 100%; object-fit: cover; }
    .coin-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .weight-tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,0.07); color: var(--muted); font-weight: 600; }
    .asset-mid { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 6px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
    .asset-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    canvas.spark { width: 95px; height: 32px; }

    /* Privacy blur */
    .blur-mode .sensitive { filter: blur(6px); user-select: none; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e293b; color: #fff; border: 1px solid var(--border-hover);
      padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transition: all .25s ease; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .shimmer { opacity: 0.6; pointer-events: none; }
    footer { color: var(--muted); font-size: 12px; margin: 28px 0; text-align: center; }
  </style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="brand"><span class="brand-dot"></span> Holdings</div>
    <div class="actions">
      <button id="privacyBtn" class="ghost icon-btn" title="Verberg bedragen">👁️</button>
      <button id="refreshNow" class="ghost icon-btn" title="Ververs koersen">↻</button>
      <button id="exportBtn" class="ghost icon-btn">Export</button>
      <label for="importFile" class="ghost icon-btn" style="cursor:pointer;margin:0;border:1px solid var(--border);border-radius:11px">Import</label>
      <input id="importFile" type="file" accept="application/json" style="display:none" />
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <!-- Linkerkolom: Overzicht & Posities -->
    <section class="card">
      <div class="hero-top">
        <div>
          <div class="hero-label">Totale Portefeuillewaarde</div>
          <div class="hero-val sensitive" id="heroTotal">€ 0,00</div>
          <div class="hero-sub">
            <span>Inleg: <strong class="sensitive" id="heroInvested">€ 0,00</strong></span>
            <span id="heroPlBadge" class="pill neutral sensitive">€ 0,00 (0%)</span>
          </div>
        </div>
        <div style="text-align:right">
          <div id="statusNote" class="hero-label">—</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            <span id="best" class="pill neutral">🏆 —</span>
            <span id="worst" class="pill neutral">📉 —</span>
          </div>
        </div>
      </div>

      <div class="chart-box" id="pieWrap">
        <canvas id="pie"></canvas>
      </div>

      <!-- Toevoegen / DCA Formulier -->
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <div class="field">
          <label for="search">Munt zoeken & selecteren</label>
          <input id="search" autocomplete="off" placeholder="Typ naam of ticker (bv. Bitcoin, SOL, ENJ)..." />
          <div id="dropdown" class="dropdown"></div>
        </div>

        <div class="form-grid">
          <div>
            <label for="amount">Aantal munten</label>
            <input id="amount" type="number" step="any" placeholder="0.00" />
          </div>
          <div>
            <label for="avgCost">Aankoopprijs per munt (<span id="curLabel">EUR</span>)</label>
            <input id="avgCost" type="number" step="any" placeholder="0.00" />
          </div>
        </div>

        <div class="form-grid">
          <button id="dcaBtn" class="dca">+ Bijkoop toevoegen (DCA)</button>
          <button id="addBtn" class="primary">Positie opslaan / overschrijven</button>
        </div>
      </div>

      <!-- Lijst met Munten -->
      <div class="assets-header">
        <strong style="font-size:15px">Jouw Posities</strong>
        <select id="sortSel" style="width:auto;padding:6px 10px;font-size:12px">
          <option value="value">Sorteer: Hoogste waarde</option>
          <option value="plPct">Sorteer: Beste rendement (%)</option>
          <option value="change24h">Sorteer: 24u verandering</option>
        </select>
      </div>
      <div class="assets" id="assets"></div>
    </section>

    <!-- Rechterkolom: Instellingen -->
    <aside class="card">
      <h3 style="margin:0 0 12px;font-size:16px">Voorkeuren</h3>
      <div class="form-grid">
        <div>
          <label for="fiat">Valuta</label>
          <select id="fiat">
            <option value="eur" selected>EUR (€)</option>
            <option value="usd">USD ($)</option>
          </select>
        </div>
        <div>
          <label for="refresh">Auto-refresh (min)</label>
          <input id="refresh" type="number" min="1" value="5" />
        </div>
      </div>

      <div style="display:grid;gap:10px;margin-top:14px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)">
          <input id="toggleSpark" type="checkbox" checked /> 7-daagse sparklines tonen
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)">
          <input id="toggleBadges" type="checkbox" checked /> 24u & 7d percentages tonen
        </label>
      </div>

      <button id="saveSettings" class="primary" style="margin-top:14px">Instellingen toepassen</button>

      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:grid;gap:8px">
        <button id="installBtn" class="ghost">📲 Installeer als App (PWA)</button>
        <button id="loadSample" class="ghost">🧪 Laad voorbeeldportfolio</button>
        <button id="forceBtn" class="ghost">🔄 Cache legen & herladen</button>
        <button id="clearBtn" class="danger" style="margin-top:6px">🗑️ Alle data wissen</button>
      </div>

      <p style="font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5">
        100% lokaal opgeslagen in je browser. Maak regelmatig een JSON-export als back-up.
      </p>
    </aside>
  </div>

  <footer>Live marktdata via CoinGecko • Holdings Pro v5</footer>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
